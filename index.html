<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Flywater Intel — Fly Fishing Conditions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;   /* current year / river flow */
  --series-2: #eb6834;   /* previous year */
  --series-ref: #898781; /* long-term average (reference) */
  --meter-track: #cde2fb;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink-1);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ---------- */
.topbar {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  max-width: 1440px; margin: 0 auto; padding: 28px 28px 8px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase;
}
.brand .tagline { color: var(--ink-2); font-size: 14px; }
.topbar .right { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.updated { color: var(--ink-3); font-size: 12.5px; }
.moon { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 12.5px; }
.moon svg { display: block; flex-shrink: 0; }
.moon b { color: var(--ink-1); font-weight: 600; }
.updated.stale {
  color: #8a4b00; background: #fdf3e0; border: 1px solid #f2d9a8;
  border-radius: 999px; padding: 4px 11px; font-weight: 600;
}

/* ---------- layout ---------- */
main { max-width: 1440px; margin: 0 auto; padding: 4px 28px 48px; }
section > h2 {
  font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin: 30px 2px 12px;
  display: flex; align-items: center; gap: 12px;
}
section > h2::after { content: ""; flex: 1; height: 1px; background: var(--grid); }
.grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
}
@media (max-width: 460px) { .grid { grid-template-columns: 1fr; } main, .topbar { padding-left: 14px; padding-right: 14px; } }

/* ---------- card ---------- */
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px;
}
.card-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.card-head h3 { margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
.card-head .sub { margin: 2px 0 0; color: var(--ink-3); font-size: 12px; }
.stat { text-align: right; flex-shrink: 0; }
.stat .value { font-size: 27px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; }
.stat .unit { color: var(--ink-3); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; margin-left: 3px; }
.stat .delta { display: block; color: var(--ink-2); font-size: 12px; margin-top: 3px; }
.stat .delta .arrow { font-size: 10px; }

/* fact chips (rivers) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px; color: var(--ink-2); background: var(--page);
  border: 1px solid var(--grid); border-radius: 999px; padding: 3px 10px;
}
.chip b { color: var(--ink-1); font-weight: 650; }
.chip.warn { color: #8a4b00; background: #fdf3e0; border-color: #f2d9a8; font-weight: 600; }

/* stocking */
.stock { border-top: 1px solid var(--grid); padding-top: 9px; font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.stock .lbl { color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 1px; }
.stock .rec { display: flex; gap: 10px; }
.stock .when { color: var(--ink-1); font-weight: 600; min-width: 50px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.stock .note { color: var(--ink-3); }
.stock a { color: var(--series-1); text-decoration: none; }
.stock a:hover { text-decoration: underline; }

/* meter (reservoirs) */
.meter-row { display: flex; align-items: center; gap: 10px; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--meter-track); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }
.meter-row .pct { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.meter-row .pct b { color: var(--ink-1); font-weight: 650; }

/* chart */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; }
.tooltip {
  position: absolute; pointer-events: none; display: none; z-index: 5;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow); padding: 7px 10px; font-size: 12px; min-width: 130px;
}
.tooltip .tt-date { color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.tooltip .tt-key { width: 12px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
.tooltip .tt-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.tooltip .tt-name { color: var(--ink-2); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: -2px; }
.legend .l-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend .l-key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; }

.meta { color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--grid); padding-top: 9px; }

/* ---------- weather ---------- */
.wx { border-top: 1px solid var(--grid); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.wx-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wx-day { text-align: center; border: 1px solid var(--grid); border-radius: 10px; padding: 8px 4px 7px; }
.wx-day .dow { font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.wx-day svg { width: 26px; height: 26px; margin: 3px auto 1px; display: block; color: var(--ink-2); }
.wx-day .cond { font-size: 11px; color: var(--ink-3); min-height: 14px; }
.wx-day .temps { font-size: 13px; margin-top: 2px; }
.wx-day .temps b { font-weight: 650; }
.wx-day .temps span { color: var(--ink-3); }
.wx-day .row2 { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
.wx-sun { font-size: 12px; color: var(--ink-2); }
.wx-sun b { color: var(--ink-1); font-weight: 600; }
.wx-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px;
  border: 1px solid var(--grid); border-radius: 999px; padding: 3px 10px 3px 8px; color: var(--ink-1);
}
.badge .dot { width: 9px; height: 9px; border-radius: 50%; }
.press { display: inline-flex; align-items: center; gap: 5px; }
.press b { color: var(--ink-1); font-weight: 650; }
.press .tr { font-size: 12px; }

/* table view */
details.table-view { border-top: 1px solid var(--grid); padding-top: 8px; }
details.table-view summary {
  cursor: pointer; color: var(--ink-3); font-size: 12px; list-style: none; user-select: none;
}
details.table-view summary::before { content: "▸ "; }
details.table-view[open] summary::before { content: "▾ "; }
details.table-view table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
details.table-view th {
  text-align: right; color: var(--ink-3); font-weight: 600; padding: 3px 6px;
  border-bottom: 1px solid var(--grid);
}
details.table-view th:first-child, details.table-view td:first-child { text-align: left; }
details.table-view td { text-align: right; padding: 3px 6px; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
details.table-view td:first-child { color: var(--ink-1); }
</style>
</head>

const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const fmtCompact = n => {
  if (n == null) return "—";
  const one = v => (Math.abs(v) >= 100 ? Math.round(v).toString() : v.toFixed(1).replace(/\.0$/, ""));
  if (Math.abs(n) >= 1e6) return one(n / 1e6) + "M";
  if (Math.abs(n) >= 1e3) return one(n / 1e3) + "K";
  return String(Math.round(n));
};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const isoDate = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayISO = () => isoDate(new Date());

const clock = hm => {
  if (!hm) return "—";
  const [h, m] = hm.split(":").map(Number);
  return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h < 12 ? " AM" : " PM");
};
/* Labels are resolved against the *reader's* clock, not build time — so a page left

};

function deltaText(now, before, label) {
  if (now == null || before == null || before === 0) return "";
  const pct = 100 * (now - before) / before;
  if (Math.abs(pct) < 0.05) return "· steady vs " + label;

  rain: '<path d="M6.5 14.5h10a4 4 0 0 0 .7-7.94A5.5 5.5 0 0 0 6.4 7.6 3.8 3.8 0 0 0 6.5 14.5z"/><g stroke-linecap="round"><line x1="8.5" y1="17" x2="7.7" y2="20"/><line x1="12.4" y1="17" x2="11.6" y2="20"/><line x1="16.3" y1="17" x2="15.5" y2="20"/></g>',
  snow: '<path d="M6.5 14.5h10a4 4 0 0 0 .7-7.94A5.5 5.5 0 0 0 6.4 7.6 3.8 3.8 0 0 0 6.5 14.5z"/><g stroke-linecap="round"><line x1="8.3" y1="17.4" x2="8.3" y2="17.5"/><line x1="12.1" y1="19.4" x2="12.1" y2="19.5"/><line x1="15.9" y1="17.4" x2="15.9" y2="17.5"/></g>',

};
function wxIcon(code) {
  let key = "cloud", label = "Cloudy";
  if (code === 0) { key = "sun"; label = "Sunny"; }
  else if (code === 1) { key = "sun"; label = "Mostly sunny"; }
  else if (code === 2) { key = "partly"; label = "Partly cloudy"; }
  else if (code === 3) { key = "cloud"; label = "Overcast"; }
  else if (code === 45 || code === 48) { key = "fog"; label = "Fog"; }
  else if (code >= 51 && code <= 57) { key = "rain"; label = "Drizzle"; }
  else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) { key = "rain"; label = "Rain"; }
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { key = "snow"; label = "Snow"; }
  else if (code >= 95) { key = "storm"; label = "T-storm"; }
  const svg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' + ICONS[key] + "</svg>";
  return { svg, label };
}

function aqiInfo(aqi) {
  if (aqi == null) return { label: "AQI —", color: "var(--ink-3)" };
  if (aqi <= 50) return { label: "Good", color: "var(--status-good)" };
  if (aqi <= 100) return { label: "Moderate", color: "var(--status-warning)" };
  if (aqi <= 150) return { label: "Unhealthy (sensitive)", color: "var(--status-serious)" };
  if (aqi <= 200) return { label: "Unhealthy", color: "var(--status-critical)" };
  if (aqi <= 300) return { label: "Very unhealthy", color: "var(--status-critical)" };
  return { label: "Hazardous", color: "var(--status-critical)" };
}

function uvLabel(uv) {
  if (uv < 3) return "low";
  if (uv < 6) return "moderate";
  if (uv < 8) return "high";
  if (uv < 11) return "very high";
  return "extreme";
}

/* ---------------- moon ----------------
   Phase dates come from the US Naval Observatory at build time; today's phase and
   brightness are worked out against the reader's clock. */
const SYNODIC = 29.530589;
function moonIcon(lit, waxing) {
  const r = 7, c = 8, x = Math.abs(r * (1 - 2 * lit)).toFixed(2);
  const outer = waxing ? 1 : 0;                       // lit limb on the right while waxing
  const inner = (lit < 0.5) === waxing ? 0 : 1;       // which way the shadow edge bulges
  const d = `M${c} ${c - r}A${r} ${r} 0 0 ${outer} ${c} ${c + r}A${x} ${r} 0 0 ${inner} ${c} ${c - r}Z`;
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#4a4945"/><path d="${d}" fill="#f4e6b0"/><circle cx="8" cy="8" r="7" fill="none" stroke="#898781" stroke-width=".6"/></svg>`;
}
function renderMoon() {
  const box = document.getElementById("moon");
  const phases = (DATA.moon || []).map(p => ({ name: p.phase, t: new Date(p.utc) }));
  const now = new Date();
  const past = phases.filter(p => p.t <= now);
  const lastNew = past.filter(p => p.name === "New Moon").pop();
  if (!past.length || !lastNew) { box.hidden = true; return; }
  const age = (now - lastNew.t) / 86400000;
  const lit = (1 - Math.cos(2 * Math.PI * age / SYNODIC)) / 2;
  const nice = n => n.charAt(0) + n.slice(1).toLowerCase();
  const onToday = phases.find(p => p.t.toDateString() === now.toDateString());
  const name = onToday ? nice(onToday.name) : {
    "New Moon": "Waxing crescent", "First Quarter": "Waxing gibbous",
    "Full Moon": "Waning gibbous", "Last Quarter": "Waning crescent",
  }[past[past.length - 1].name];
  const upcoming = ["New Moon", "Full Moon"]
    .map(n => phases.find(p => p.name === n && p.t > now && p.t.toDateString() !== now.toDateString()))
    .filter(Boolean).sort((a, b) => a.t - b.t);
  box.textContent = "";
  const holder = el("span"); holder.innerHTML = moonIcon(lit, age < SYNODIC / 2); // numbers only
  box.appendChild(holder.firstChild);
  const txt = el("span");
  txt.appendChild(el("b", null, name));
  txt.appendChild(document.createTextNode(" · " + Math.round(lit * 100) + "% lit" +
    upcoming.map(p => " · " + nice(p.name) + " " + MONTHS[p.t.getMonth()] + " " + p.t.getDate()).join("")));
  box.appendChild(txt);
  box.hidden = false;
}

function stockingBlock(s) {

}

/* ---------------- chart engine ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function niceTicks(min, max, count) {
  if (min === max) { max = min + 1; }
  const span = max - min;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  let step = mag;
  for (const m of [1, 2, 2.5, 5, 10]) { if (step0 <= m * mag) { step = m * mag; break; } }
  const lo = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 1e-9; v += step) if (v >= min - 1e-9) ticks.push(v);
  return ticks;
}

/**
 * Draw a multi-series line chart.
 * cfg: { wrap, dates, series: [{name, color, values, area?}], unit, height }
 */
function drawChart(cfg) {
  const wrap = cfg.wrap;
  wrap.textContent = "";
  const W = Math.max(280, wrap.clientWidth);
  const H = cfg.height || 210;
  const PAD = { l: 44, r: 12, t: 12, b: 22 };
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
  wrap.appendChild(svg);

  const n = cfg.dates.length;
  const all = [];
  cfg.series.forEach(s => s.values.forEach(v => { if (v != null) all.push(v); }));
  if (!all.length || n < 2) return;
  let yMin = Math.min(0, Math.min(...all));
  let yMax = Math.max(...all);
  if (cfg.zeroBase === false) yMin = Math.min(...all);
  const yPadTop = (yMax - yMin) * 0.06 || 1;
  yMax += yPadTop;

  const x = i => PAD.l + (i / (n - 1)) * (W - PAD.l - PAD.r);
  const y = v => PAD.t + (1 - (v - yMin) / (yMax - yMin)) * (H - PAD.t - PAD.b);

  // gridlines + y ticks
  const ticks = niceTicks(yMin, yMax, 4);
  for (const t of ticks) {
    svg.appendChild(svgEl("line", { x1: PAD.l, x2: W - PAD.r, y1: y(t), y2: y(t), stroke: cssVar("--grid"), "stroke-width": 1 }));
    const lbl = svgEl("text", { x: PAD.l - 6, y: y(t) + 3.5, "text-anchor": "end", "font-size": 10.5, fill: cssVar("--ink-3"), style: "font-variant-numeric: tabular-nums" });
    lbl.textContent = fmtCompact(t);
    svg.appendChild(lbl);
  }
  // baseline
  svg.appendChild(svgEl("line", { x1: PAD.l, x2: W - PAD.r, y1: H - PAD.b, y2: H - PAD.b, stroke: cssVar("--baseline"), "stroke-width": 1 }));

  // x ticks at month starts (thin every other when crowded)
  const monthIdx = [];
  for (let i = 0; i < n; i++) if (cfg.dates[i].slice(8, 10) === "01") monthIdx.push(i);
  const everyOther = monthIdx.length > 8 && W < 560;
  monthIdx.forEach((i, k) => {
    if (everyOther && k % 2 === 1) return;
    const d = new Date(cfg.dates[i] + "T12:00:00");
    const lbl = svgEl("text", { x: x(i), y: H - 7, "text-anchor": "middle", "font-size": 10.5, fill: cssVar("--ink-3") });
    lbl.textContent = MONTHS[d.getMonth()];
    svg.appendChild(lbl);
  });

  // series paths (skip nulls -> gaps)
  function pathFor(values) {
    let d = "", pen = false;
    for (let i = 0; i < n; i++) {
      const v = values[i];
      if (v == null) { pen = false; continue; }
      d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      pen = true;
    }
    return d;
  }
  for (const s of cfg.series) {
    if (s.area) {
      // area wash under the line (10% opacity), splitting at gaps
      let d = "", run = [];
      const flush = () => {
        if (run.length < 2) { run = []; return; }
        d += "M" + x(run[0]).toFixed(1) + " " + (H - PAD.b);
        for (const i of run) d += "L" + x(i).toFixed(1) + " " + y(s.values[i]).toFixed(1);
        d += "L" + x(run[run.length - 1]).toFixed(1) + " " + (H - PAD.b) + "Z";
        run = [];
      };
      for (let i = 0; i < n; i++) { if (s.values[i] == null) flush(); else run.push(i); }
      flush();
      svg.appendChild(svgEl("path", { d, fill: s.color, opacity: 0.1, stroke: "none" }));
    }
  }
  for (const s of cfg.series) {
    svg.appendChild(svgEl("path", {
      d: pathFor(s.values), fill: "none", stroke: s.color,
      "stroke-width": s.ref ? 1.6 : 2, "stroke-linejoin": "round", "stroke-linecap": "round",
      "stroke-dasharray": s.ref ? "4 4" : "none", opacity: s.ref ? 0.9 : 1,
    }));
  }
  // end dot on the primary series with a surface ring
  const prim = cfg.series[0];
  let lastIdx = -1;
  for (let i = n - 1; i >= 0; i--) if (prim.values[i] != null) { lastIdx = i; break; }
  if (lastIdx >= 0) {
    svg.appendChild(svgEl("circle", { cx: x(lastIdx), cy: y(prim.values[lastIdx]), r: 6, fill: cssVar("--surface-1") }));
    svg.appendChild(svgEl("circle", { cx: x(lastIdx), cy: y(prim.values[lastIdx]), r: 4, fill: prim.color }));
  }

  /* hover layer: crosshair + tooltip */
  const hair = svgEl("line", { y1: PAD.t, y2: H - PAD.b, stroke: cssVar("--baseline"), "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(hair);
  const dots = cfg.series.map(s => {
    const g = svgEl("g", { visibility: "hidden" });
    g.appendChild(svgEl("circle", { r: 5.5, fill: cssVar("--surface-1") }));
    g.appendChild(svgEl("circle", { r: 3.5, fill: s.color }));
    svg.appendChild(g);
    return g;
  });
  const tip = el("div", "tooltip");
  wrap.appendChild(tip);

  function showAt(clientX) {
    const rect = svg.getBoundingClientRect();
    const px = clientX - rect.left;
    let i = Math.round((px - PAD.l) / (W - PAD.l - PAD.r) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i));
    hair.setAttribute("visibility", "visible");
    tip.textContent = "";
    tip.appendChild(el("div", "tt-date", prettyDate(cfg.dates[i])));
    cfg.series.forEach((s, k) => {
      const v = s.values[i];
      if (v == null) { dots[k].setAttribute("visibility", "hidden"); }
      else {
        dots[k].setAttribute("transform", `translate(${x(i)},${y(v)})`);
        dots[k].setAttribute("visibility", "visible");
      }
      const row = el("div", "tt-row");
      const key = el("i", "tt-key"); key.style.borderTopColor = s.color;
      row.appendChild(key);
      row.appendChild(el("span", "tt-val", v == null ? "—" : fmt(v)));
      row.appendChild(el("span", "tt-name", s.name));
      tip.appendChild(row);
    });
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    const left = x(i) + 14 + tw > W ? x(i) - tw - 14 : x(i) + 14;
    tip.style.left = left + "px";
    tip.style.top = PAD.t + 4 + "px";
  }
  function hide() {
    hair.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
    tip.style.display = "none";
  }
  svg.addEventListener("pointermove", e => showAt(e.clientX));
  svg.addEventListener("pointerleave", hide);
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("focus", () => showAt(svg.getBoundingClientRect().right - PAD.r));
  svg.addEventListener("blur", hide);
}

/* ---------------- monthly summary tables ---------------- */
function monthlyTable(dates, seriesDefs) {
  // seriesDefs: [{name, values}]  -> rows of month | per-series mean
  const buckets = new Map();
  dates.forEach((d, i) => {
    const key = d.slice(0, 7);
    if (!buckets.has(key)) buckets.set(key, seriesDefs.map(() => []));
    seriesDefs.forEach((s, k) => { if (s.values[i] != null) buckets.get(key)[k].push(s.values[i]); });
  });
  const table = el("table");
  const thead = el("thead"); const hr = el("tr");
  hr.appendChild(el("th", null, "Month"));
  seriesDefs.forEach(s => hr.appendChild(el("th", null, s.name)));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el("tbody");
  for (const [key, cols] of buckets) {
    const tr = el("tr");
    const d = new Date(key + "-15T12:00:00");
    tr.appendChild(el("td", null, MONTHS[d.getMonth()] + " " + String(d.getFullYear()).slice(2)));
    cols.forEach(arr => {
      const mean = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
      tr.appendChild(el("td", null, mean == null ? "—" : fmt(mean)));
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

/* ---------------- weather block ---------------- */
function weatherBlock(w) {
  const wx = el("div", "wx");
  const days = el("div", "wx-days");
  (w.days || []).forEach(d => {
    const c = el("div", "wx-day");
    c.appendChild(el("div", "dow", dowName(d.date)));
    const ic = wxIcon(d.code);
    const holder = el("div"); holder.innerHTML = ic.svg; // static icon markup only
    c.appendChild(holder.firstChild);
    c.appendChild(el("div", "cond", ic.label));
    const t = el("div", "temps");
    t.appendChild(el("b", null, Math.round(d.hi) + "°"));
    t.appendChild(el("span", null, " / " + Math.round(d.lo) + "°"));
    c.appendChild(t);
    const rain = (d.precip_in ?? 0) >= 0.005 ? d.precip_in.toFixed(2) + '"' : "0\"";
    c.appendChild(el("div", "row2", "Rain " + rain + (d.precip_pct != null ? " · " + Math.round(d.precip_pct) + "%" : "")));
    c.appendChild(el("div", "row2", "Wind " + Math.round(d.wind_mph) + " · gust " + Math.round(d.gust_mph) + " mph"));
    if (d.uv != null) c.appendChild(el("div", "row2", "UV " + Math.round(d.uv) + " · " + uvLabel(Math.round(d.uv))));
    days.appendChild(c);
  });
  wx.appendChild(days);

  const sunDay = (w.days || []).find(d => d.date === todayISO()) || (w.days || [])[0];
  if (sunDay && sunDay.sunrise) {
    const sun = el("div", "wx-sun");
    sun.appendChild(el("b", null, dowName(sunDay.date) + ": "));
    sun.appendChild(document.createTextNode(
      "first light " + clock(sunDay.first_light) + " · sunrise " + clock(sunDay.sunrise) +
      " · sunset " + clock(sunDay.sunset) + " · last light " + clock(sunDay.last_light)));
    wx.appendChild(sun);
  }

  const foot = el("div", "wx-foot");
  const aqi = aqiInfo(w.aqi);
  const badge = el("span", "badge");
  const dot = el("i", "dot"); dot.style.background = aqi.color;
  badge.appendChild(dot);
  badge.appendChild(document.createTextNode("AQI " + (w.aqi ?? "—") + " · " + aqi.label));
  foot.appendChild(badge);

  const press = el("span", "press");
  press.appendChild(document.createTextNode("Pressure "));
  press.appendChild(el("b", null, w.now && w.now.pressure_inhg != null ? w.now.pressure_inhg.toFixed(2) + " inHg" : "—"));
  if (w.pressure_trend) {
    const t = w.pressure_trend;
    const sym = t.dir === "rising" ? "↑" : t.dir === "falling" ? "↓" : "→";
    press.appendChild(el("span", "tr", sym + " " + t.dir));
  }
  foot.appendChild(press);
  wx.appendChild(foot);
  return wx;
}

/* A sharp rise or drop in the last 6 (or 24) hours — usually a dam release change,
   which can muddy or strand a river within hours. Ignores tiny absolute changes
   so a 10-cfs river doesn't cry wolf. */
function flowJump(pts) {
  if (!pts || pts.length < 2) return null;
  const [lastT, now] = pts[pts.length - 1];
  const tl = new Date(lastT).getTime();
  if (Date.now() - tl > 3 * 3600e3) return null;          // only for current readings
  const near = hours => {
    let best = null;
    for (const [t, v] of pts) {
      const gap = Math.abs(new Date(t).getTime() - (tl - hours * 3600e3));
      if (gap <= 45 * 60e3 && (!best || gap < best.gap)) best = { gap, v };
    }
    return best && best.v;
  };
  for (const [hours, minPct] of [[6, 30], [24, 50]]) {
    const then = near(hours);
    if (!then || then <= 0) continue;
    const pct = 100 * (now - then) / then;
    if (Math.abs(pct) >= minPct && Math.abs(now - then) >= 20) return { hours, pct, then, now };
  }
  return null;
}

function flowChips(r) {
  const row = el("div", "chips");
  const jump = flowJump(r.recent);
  if (jump) {
    const span = jump.hours + " hours";
    const what = jump.pct >= 100 ? "jumped " + (jump.now / jump.then).toFixed(1).replace(/\.0$/, "") + "×"
      : (jump.pct > 0 ? "up " : "down ") + Math.round(Math.abs(jump.pct)) + "%";
    const c = el("span", "chip warn", "⚠ Flow " + what + " in the last " + span + " (" + fmt(jump.then) + " → " + fmt(jump.now) + " cfs)");
    row.appendChild(c);
  }
  const day = (r.live_time || r.latest_date || "").slice(0, 10);
  const n = r.normals && day && r.normals.days[day.slice(5)];
  if (n && n[1] > 0 && r.latest_cfs != null) {
    const ratio = r.latest_cfs / n[1], pct = 100 * (ratio - 1), md = shortDate(day);
    const text = ratio >= 2 ? (ratio >= 10 ? Math.round(ratio) : ratio.toFixed(1).replace(/\.0$/, "")) + "× normal"
      : Math.abs(pct) < 10 ? "About normal"
      : Math.round(Math.abs(pct)) + "% " + (pct > 0 ? "above" : "below") + " normal";
    const c = el("span", "chip");
    c.appendChild(el("b", null, text));
    c.appendChild(document.createTextNode(" for " + md + " · " + r.normals.n + "-yr median " + fmt(n[1]) + " cfs"));
    c.title = "Median flow on " + md + " over water years " + r.normals.years +
      ". Half of those years fall between " + fmt(n[0]) + " and " + fmt(n[2]) + " cfs.";
    row.appendChild(c);
  }
  const wt = r.water_temp_c;
  if (wt && Date.now() - new Date(wt[0]).getTime() < 24 * 3600e3) {
    const c = el("span", "chip");
    c.appendChild(document.createTextNode("Water "));
    c.appendChild(el("b", null, Math.round(wt[1] * 9 / 5 + 32) + "°F"));
    c.title = "Water temperature at the gauge, as of " + readingTime(wt[0]);
    row.appendChild(c);
  }
  return row;
}

function riverCard(r) {
  const card = el("article", "card");
  const head = el("div", "card-head");
  const left = el("div");
  left.appendChild(el("h3", null, r.name));
  left.appendChild(el("p", "sub", r.sub));
  head.appendChild(left);
  const stat = el("div", "stat");
  stat.appendChild(el("span", "value", fmt(r.latest_cfs)));
  stat.appendChild(el("span", "unit", "CFS"));
  stat.appendChild(el("span", "delta", deltaText(r.latest_cfs, r.week_ago_cfs, "last week")));
  if (r.live_time) stat.appendChild(el("span", "delta", "as of " + readingTime(r.live_time)));
  head.appendChild(stat);
  card.appendChild(head);

  const chips = flowChips(r);
  if (chips.childNodes.length) card.appendChild(chips);

  const wrap = el("div", "chart-wrap");
  card.appendChild(wrap);
  const mkSeries = () => {
    const out = [{ name: "Discharge", label: "Daily flow", color: cssVar("--series-1"), values: r.flows, area: true }];
    if (r.normals) out.push({
      name: r.normals.n + "-yr median", color: cssVar("--series-ref"), ref: true,
      values: r.dates.map(d => { const n = r.normals.days[d.slice(5)]; return n ? n[1] : null; }),
    });
    return out;
  };
  charts.push(() => drawChart({ wrap, dates: r.dates, height: 195, series: mkSeries() }));
  if (r.normals) card.appendChild(legendFor(mkSeries()));

  const range = "12-mo range " + fmt(r.year_min) + "–" + fmt(r.year_max) + " cfs";
  const drain = r.drain_area_sqmi ? " · drainage " + fmt(parseFloat(r.drain_area_sqmi)) + " sq mi" : "";
  const elev = r.elev_ft ? " · gauge elev " + fmt(parseFloat(r.elev_ft)) + " ft" : "";
  card.appendChild(el("div", "meta", range + drain + elev));
  const stock = stockingBlock(r.stocking);
  if (stock) card.appendChild(stock);
  card.appendChild(weatherBlock(r.weather));
  return card;
}

function renderRivers() {
  for (let i = charts.length - 1; i >= 0; i--) if (charts[i].river) charts.splice(i, 1);
  const vg = document.getElementById("rivers");
  vg.textContent = "";
  const first = charts.length;
  DATA.rivers.forEach(r => vg.appendChild(riverCard(r)));
  for (let i = first; i < charts.length; i++) { charts[i].river = true; charts[i](); }
}

function renderAll() {
  charts.length = 0;
  const rg = document.getElementById("reservoirs");
  rg.textContent = "";
  DATA.reservoirs.forEach(r => rg.appendChild(reservoirCard(r)));
  charts.forEach(fn => fn());
  renderRivers();
}

/* ---------------- live river flows ----------------
   USGS allows browsers to read its data directly, so every visitor gets current
   flows without waiting for the 5 AM rebuild. The baked-in 5 AM numbers render
   first and stay on screen if USGS is slow or down. (Reservoirs can't do this:
   USBR's server doesn't allow it.) */
function readingTime(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return "";
  const sameDay = t.toDateString() === new Date().toDateString();
  return sameDay
    ? t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })
    : MONTHS[t.getMonth()] + " " + t.getDate();
}

async function getJSON(url, ms) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

/* -> { site: { "00060": [[time, value]...], "00010": [...] } } (flow, water temp °C) */
function pointsBySite(json) {
  const out = {};
  for (const ts of (json && json.value && json.value.timeSeries) || []) {
    const pts = [];
    for (const p of (ts.values[0] && ts.values[0].value) || []) {
      const v = parseFloat(p.value);
      if (isFinite(v) && v > -99999) pts.push([p.dateTime, v]);
    }
    const site = ts.sourceInfo.siteCode[0].value;
    (out[site] = out[site] || {})[ts.variable.variableCode[0].value] = pts;
  }
  return out;
}

let lastLive = 0;
async function refreshRivers() {
  lastLive = Date.now();
  const sites = "&sites=" + DATA.rivers.map(r => r.id).join(",");
  const base = "https://waterservices.usgs.gov/nwis/";
  const [dv, iv] = await Promise.allSettled([
    getJSON(base + "dv/?format=json&parameterCd=00060&period=P365D" + sites, 30000),
    getJSON(base + "iv/?format=json&parameterCd=00060,00010&period=P1D" + sites, 30000),
  ]);
  const daily = dv.status === "fulfilled" ? pointsBySite(dv.value) : {};
  const latest = iv.status === "fulfilled" ? pointsBySite(iv.value) : {};
  let changed = false;
  for (const r of DATA.rivers) {
    const d = daily[r.id] && daily[r.id]["00060"];
    if (d && d.length >= 8) {
      r.dates = d.map(p => p[0].slice(0, 10));
      r.flows = d.map(p => p[1]);
      r.year_min = Math.min(...r.flows);
      r.year_max = Math.max(...r.flows);
      r.latest_cfs = r.flows[r.flows.length - 1];
      r.week_ago_cfs = r.flows[r.flows.length - 8];
      changed = true;
    }
    const live = latest[r.id] || {};
    const i = live["00060"];
    if (i && i.length) {
      const [when, cfs] = i[i.length - 1];
      r.recent = i;
      r.latest_cfs = cfs;
      r.live_time = when;
      const wk = new Date(when.slice(0, 10) + "T12:00:00");
      wk.setDate(wk.getDate() - 7);
      const idx = r.dates.indexOf(isoDate(wk));
      if (idx >= 0) r.week_ago_cfs = r.flows[idx];
      changed = true;
    }
    const t = live["00010"];
    if (t && t.length) { r.water_temp_c = t[t.length - 1]; changed = true; }
  }
  if (changed) renderRivers();
}

/* Freshness stamp. If the page was built before today, say so plainly rather than
   letting a stale page look current. */
(function () {
  const stamp = document.getElementById("updated");
  const builtDay = (DATA.built_iso || "").slice(0, 10);
  if (builtDay && builtDay !== todayISO()) {
    stamp.classList.add("stale");
    stamp.textContent = "⚠ Reservoir and weather data is from " + prettyDate(builtDay);
    // A tab left open overnight won't see the 5 AM rebuild on its own; re-read the
    // file periodically so it heals itself instead of sitting stale.
    setInterval(() => location.reload(), 30 * 60 * 1000);
  } else {
    stamp.textContent = "Updated " + DATA.built_at;
  }
})();
renderMoon();
renderAll();
refreshRivers();
setInterval(refreshRivers, 15 * 60 * 1000);
// Phones freeze background tabs, so also catch up when the page comes back into view.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastLive > 10 * 60 * 1000) { renderMoon(); refreshRivers(); }
});

let rT;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => charts.forEach(fn => fn()), 150); });
</script>
